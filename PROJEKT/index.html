<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Helpdesk</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <img id="lis." src="lis.jpeg">
            <p>Lis. Lisy są fajne.</i></p>
            <i style="font-size: xx-small;">Source:u/TheAcrocanthosaurus na r/foxes</i>

            <h2>Helpdesk</h2>
            <form class="FormContainer" name="Form" id="Form" method="post" onsubmit="addAnime(event)">
            
                <label for="title">Title</label><input name="title" id="title" type="text" required>
                <label for="priority">Priority</label>
                <select name="priority" id="priority">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select><br>
                <p id="content">
                    <input type="submit" value="Submit"><br>
                </p>   
            
            </form>
            <p class="FilterContainer">
                <label for="Filter">Filter</label>
                <select name="Filter" id="filterId" onchange="filter(event)">
                    <option value="all">all</option>
                    <option value="new">new</option>
                    <option value="doing">doing</option>
                    <option value="done">done</option>
                </select><br>

                <o id="counter">Counter visible: 0, all: 0</o><br>
                <ul id="listOfItems">
                    <li id="Nothing">Nothing to display</li>
                </ul>
            </p>

            <p><i>w sumie to sarny też...</p>
        </main>
        
        <script src="app.js" defer></script>
    </body>
</html>
